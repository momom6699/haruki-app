    <h2>アプリについて</h2>
    <p>
      Haruki(ハルキ)は、日々の出来事や体調を手軽に記録できる日記アプリです。
      記録したデータはご自身のGoogleドライブへバックアップでき、機種変更時にも安心して引き継ぐことができます。
      また、Health Connectと連携することで、歩数や睡眠などの健康データを日記に取り込むことができます。
    </p>
